---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Build upstream backend host list
  ansible.builtin.set_fact:
    upstream_backends: "{{ groups['webservers'] | map('extract', hostvars, ['ansible_host']) | list | unique }}"

- name: Deploy nginx reverse proxy config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload nginx
