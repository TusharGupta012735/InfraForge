groups:
  - name: infraforge-alerts
    rules:
      - alert: HighCPUUsage
        expr: avg(rate(node_cpu_seconds_total{mode!="idle"}[2m])) > 0.8
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "CPU usage above 80%"

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Memory usage above 90%"

      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes{fstype!="tmpfs"} - node_filesystem_free_bytes{fstype!="tmpfs"}) / node_filesystem_size_bytes{fstype!="tmpfs"} > 0.85
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Disk usage above 85%"

      - alert: InstanceDown
        expr: up == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Instance is down"
