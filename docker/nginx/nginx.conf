worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format infraforge '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" upstream=$upstream_addr urt=$upstream_response_time';
  access_log /var/log/nginx/access.log infraforge;

  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

  upstream sample_app {
    least_conn;
    server sample-app:3000;
  }

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/ssl/dev-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/dev-selfsigned.key;

    location / {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://sample_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
